[project]
name = "occfg"
version = "0.1.0"
description = "Sync Lemonade Server models into opencode.json"
requires-python = ">=3.10"
dependencies = ["httpx"]

[project.scripts]
occfg = "opencode_config.cli.main:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-httpserver", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/opencode_config --cov-report=xml"

[tool.ruff]
target-version = "py310"
line-length = 100
